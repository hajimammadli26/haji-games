<script>
'use strict';
// Cırtdan: Köhnə Bakıda Qaçış. A 3-lane runner through old Baku with the Div on your heels.
// Built on the one-shot starter: the fixed step, the clock hook, window.game and the play and
// figures scenes are kept for the checks. The world is three.js (#world); the HUD and screens
// are a 2D canvas on top (#game).

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
let W = 1280, H = 720;          // logical HUD size: H is fixed, W follows the window's shape
const FONT = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const TITLE = 'Cırtdan';
const SUBTITLE = 'Köhnə Bakıda Qaçış';
const CONTROLS = [
  'Sürüşdür ← →  və ya oxlar: zolaq dəyiş',
  'Sürüşdür ↑  və ya ↑ / Boşluq: tullan',
  'Sürüşdür ↓  və ya ↓: sürüş',
  'İki dəfə toxun  və ya Shift: uçan xalça',
  'P: fasilə   M: səs',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Saved between visits (wrapped: storage may be blocked) -------------------------------
const save = (() => {
  let d = { best: 0, nar: null, bread: 0 };
  try { Object.assign(d, JSON.parse(localStorage.getItem('cirtdan-save') || '{}')); } catch (e) {}
  if (d.nar === null) d.nar = tune.start_nar;
  return {
    get: k => d[k],
    set(k, v) { d[k] = v; try { localStorage.setItem('cirtdan-save', JSON.stringify(d)); } catch (e) {} },
  };
})();

// ---- Screen: HUD canvas on top of the 3D canvas -------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const worldCanvas = document.getElementById('world');
let HUD_SCALE = 1;
function fit() { // fills the window at any size and pixel ratio
  H = 720; W = Math.max(400, Math.round(H * innerWidth / innerHeight));
  HUD_SCALE = innerHeight / H;
  const r = HUD_SCALE * Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
  if (renderer) {
    renderer.setSize(innerWidth, innerHeight, true);
    camera.aspect = innerWidth / innerHeight;
    // keep about the same sideways view in portrait: three lanes always fit
    const hfov = 78 * Math.PI / 180;
    const vfov = 2 * Math.atan(Math.tan(hfov / 2) / camera.aspect) * 180 / Math.PI;
    camera.fov = Math.max(52, Math.min(100, vfov));
    camera.updateProjectionMatrix();
  }
}
function clear() { ctx.clearRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = 'bold') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function outlined(s, x, y, size, c, align = 'center') { // text readable over any scenery; shrinks to fit the width
  ctx.font = `bold ${size}px ${FONT}`;
  const room = W - 28; if (ctx.measureText(s).width > room) size = Math.floor(size * room / ctx.measureText(s).width);
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size / 5); ctx.strokeStyle = 'rgba(60,20,10,0.85)';
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---- Input: keys by position (event.code), OS key repeat ignored; swipes and taps ---------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
const anyPressed = (...codes) => codes.some(c => hit.has(c));
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
// Touch: a swipe is a lane change, jump or slide; a tap is a tap (HUD buttons, screens);
// two taps close together are the flying carpet.
let touch = null, lastTap = -1, taps = []; // taps: HUD-space points of this step's taps
function hudPoint(e) { return { x: e.clientX / HUD_SCALE, y: e.clientY / HUD_SCALE }; }
addEventListener('pointerdown', e => {
  startAudio();
  touch = { x: e.clientX, y: e.clientY, t: clock.now(), done: false, id: e.pointerId };
});
addEventListener('pointermove', e => {
  if (!touch || touch.done || e.pointerId !== touch.id) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y, m = Math.min(innerWidth, innerHeight) * 0.06;
  if (Math.abs(dx) < m && Math.abs(dy) < m) return;
  touch.done = true; // one swipe per touch, fired as soon as it is clear
  if (Math.abs(dx) > Math.abs(dy)) hit.add(dx > 0 ? 'SwipeRight' : 'SwipeLeft');
  else hit.add(dy > 0 ? 'SwipeDown' : 'SwipeUp');
});
addEventListener('pointerup', e => {
  if (!touch || e.pointerId !== touch.id) return;
  if (!touch.done) {
    const p = hudPoint(e), now = clock.now();
    taps.push(p);
    if (now - lastTap < 0.32) { hit.add('DoubleTap'); lastTap = -1; } else lastTap = now;
  }
  touch = null;
});
addEventListener('pointercancel', () => { touch = null; });
addEventListener('contextmenu', e => e.preventDefault());
const LEFT = ['ArrowLeft', 'KeyA', 'SwipeLeft'], RIGHT = ['ArrowRight', 'KeyD', 'SwipeRight'];
const UP = ['ArrowUp', 'KeyW', 'Space', 'SwipeUp'], DOWN = ['ArrowDown', 'KeyS', 'SwipeDown'];
const CARPET = ['ShiftLeft', 'ShiftRight', 'KeyE', 'DoubleTap'];
function tapIn(x, y, w, h) { return taps.some(p => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h); }

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    try {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
      out.connect(ac.destination); audio = { ac, out };
    } catch (e) { return; }
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, slideTo = 0, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.2, freq = 800) {
  if (!audio || muted) return;
  const ac = audio.ac, n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  let s = 12345; for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = (s / 0x7fffffff * 2 - 1) * (1 - i / n); }
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f).connect(g).connect(audio.out); src.start();
}
const sfx = {
  bread() { tone(1320, 0.07, 'sine', 0.18); tone(1980, 0.12, 'sine', 0.14, 0, 0.05); }, // xırt + dınq
  nar() { tone(660, 0.1, 'triangle', 0.25); tone(990, 0.1, 'triangle', 0.25, 0, 0.08); tone(1320, 0.2, 'triangle', 0.25, 0, 0.16); },
  jump() { tone(300, 0.18, 'triangle', 0.22, 620); },
  slide() { noise(0.25, 0.25, 500); },
  land() { noise(0.06, 0.2, 200); },
  step() { noise(0.03, 0.06, 1400); },
  lane() { noise(0.07, 0.12, 2400); },
  stumble() { tone(140, 0.25, 'square', 0.25, 70); noise(0.15, 0.3, 300); },
  crash() { noise(0.5, 0.5, 180); tone(110, 0.5, 'sawtooth', 0.3, 40); },
  div() { tone(90, 0.45, 'sawtooth', 0.32, 60); tone(70, 0.5, 'square', 0.12, 50, 0.05); }, // "Ay Cırtdaaan!" growl
  hamm() { tone(160, 0.12, 'sawtooth', 0.35, 90); tone(120, 0.3, 'sawtooth', 0.35, 60, 0.13); },
  power() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'triangle', 0.2, 0, i * 0.06)); },
  shieldPop() { tone(800, 0.3, 'sine', 0.3, 200); noise(0.2, 0.2, 1200); },
};

// ===================================================================================================
// ---- The 3D world --------------------------------------------------------------------------------
// ===================================================================================================
let renderer = null;
const scene3 = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.1, 400);
try {
  renderer = new THREE.WebGLRenderer({ canvas: worldCanvas, antialias: !CHEAP, powerPreference: 'high-performance' });
  renderer.setPixelRatio(CHEAP ? 0.5 : Math.min(devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
} catch (e) { renderer = null; events.push({ type: 'error', what: 'webgl: ' + e.message }); }
addEventListener('resize', fit); fit();

const SKY_FAR = new THREE.Color('#f3d6a4');
scene3.fog = new THREE.Fog(SKY_FAR, 60, 175);
scene3.add(new THREE.HemisphereLight('#bfe3ff', '#c98a4a', 1.5));
const sun = new THREE.DirectionalLight('#fff1d6', 2.3);
sun.position.set(-6, 14, 4); scene3.add(sun); scene3.add(sun.target);

// -- Painted textures, drawn once in code --------------------------------------------------------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function buta(g, x, y, s, rot, fill, line) { // the paisley teardrop, the national ornament
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 10);
  g.bezierCurveTo(-9, 9, -10, -2, -4, -7); g.bezierCurveTo(1, -11, 8, -10, 7, -15);
  g.bezierCurveTo(12, -6, 10, 8, 0, 10); g.closePath();
  g.fillStyle = fill; g.fill(); g.lineWidth = 1.6; g.strokeStyle = line; g.stroke();
  g.beginPath(); g.arc(0, 1, 3, 0, Math.PI * 2); g.fillStyle = line; g.fill();
  g.restore();
}
function drawCarpet(g, w, h, field, border, accent) { // a Qarabağ-style carpet: border, medallion, butas
  g.fillStyle = border; g.fillRect(0, 0, w, h);
  g.fillStyle = '#f4e2b8'; g.fillRect(w * 0.06, h * 0.06, w * 0.88, h * 0.88);
  g.fillStyle = field; g.fillRect(w * 0.1, h * 0.1, w * 0.8, h * 0.8);
  // border teeth
  g.fillStyle = border;
  for (let x = w * 0.1; x < w * 0.9; x += w * 0.08) { g.beginPath(); g.moveTo(x, h * 0.1); g.lineTo(x + w * 0.04, h * 0.15); g.lineTo(x + w * 0.08, h * 0.1); g.fill(); g.beginPath(); g.moveTo(x, h * 0.9); g.lineTo(x + w * 0.04, h * 0.85); g.lineTo(x + w * 0.08, h * 0.9); g.fill(); }
  // central medallion: a stepped diamond
  const cx = w / 2, cy = h / 2;
  [[0.34, accent], [0.26, '#f4e2b8'], [0.19, border], [0.1, accent]].forEach(([k, c]) => {
    g.fillStyle = c; g.beginPath(); g.moveTo(cx, cy - h * k); g.lineTo(cx + w * k * 0.75, cy); g.lineTo(cx, cy + h * k); g.lineTo(cx - w * k * 0.75, cy); g.closePath(); g.fill();
  });
  const s = Math.min(w, h) / 70;
  [[0.22, 0.24, 0.4], [0.78, 0.24, 2.4], [0.22, 0.76, -0.7], [0.78, 0.76, 3.6]].forEach(([u, v, r]) => buta(g, w * u, h * v, s, r, accent, '#f4e2b8'));
}
const TEX = {
  cobble: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#8f7a5c'; g.fillRect(0, 0, w, h);
    let s = 7; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    for (let row = 0; row < 8; row++) for (let col = 0; col < 6; col++) {
      const x = col * 44 + (row % 2) * 22 - 10, y = row * 32 + 2;
      const v = 150 + r() * 50 | 0;
      g.fillStyle = `rgb(${v + 30},${v + 10},${v - 30})`;
      rrectPath(g, x + 2, y + 2, 40, 28, 9); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.12)'; rrectPath(g, x + 6, y + 4, 26, 9, 5); g.fill();
    }
  }, [2, 6]),
  wall: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#d9a95f'; g.fillRect(0, 0, w, h);
    let s = 3; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    for (let row = 0; row < 8; row++) for (let col = 0; col < 4; col++) {
      const x = col * 64 + (row % 2) * 32, y = row * 32;
      const v = r() * 30 - 15;
      g.fillStyle = `rgb(${230 + v},${186 + v},${112 + v})`; g.fillRect(x + 2, y + 2, 60, 28);
      g.fillStyle = 'rgba(120,70,20,0.10)'; g.fillRect(x + 2, y + 22, 60, 8);
    }
  }, [1, 1]),
  shebeke: canvasTex(128, 192, (g, w, h) => { // şəbəkə: wooden lattice with coloured glass
    g.fillStyle = '#5a3216'; g.fillRect(0, 0, w, h);
    const cols = ['#d6362f', '#2c6fd1', '#f0c02f', '#3ea35a'];
    for (let y = 8; y < h - 8; y += 20) for (let x = 8; x < w - 8; x += 20) {
      g.fillStyle = cols[((x + y) / 20 | 0) % 4];
      g.beginPath(); g.moveTo(x + 10, y); g.lineTo(x + 20, y + 10); g.lineTo(x + 10, y + 20); g.lineTo(x, y + 10); g.closePath(); g.fill();
    }
    g.strokeStyle = '#3b1f0c'; g.lineWidth = 3;
    for (let y = 8; y < h; y += 20) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8);
    g.fillStyle = '#5a3216'; g.beginPath(); g.moveTo(0, 0); g.lineTo(w, 0); g.lineTo(w, 30); g.quadraticCurveTo(w / 2, -12, 0, 30); g.fill();
  }),
  carpetRed: canvasTex(256, 384, (g, w, h) => drawCarpet(g, w, h, '#b3262a', '#1d3f8a', '#e8b23a')),
  carpetBlue: canvasTex(256, 384, (g, w, h) => drawCarpet(g, w, h, '#1d4f9a', '#9e1f24', '#f0c24b')),
  carpetGreen: canvasTex(256, 384, (g, w, h) => drawCarpet(g, w, h, '#2b7a48', '#8e1d22', '#f2d16b')),
  vest: canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#1f4f8f'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#f1c34a'; g.lineWidth = 6; g.strokeRect(6, 6, w - 12, h - 12);
    buta(g, 40, 64, 2.2, 0.5, '#f1c34a', '#b52b28'); buta(g, 90, 64, 2.2, -0.5, '#f1c34a', '#b52b28');
  }),
  wicker: canvasTex(128, 64, (g, w, h) => {
    g.fillStyle = '#b07a35'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 8) for (let x = 0; x < w; x += 16) {
      g.fillStyle = (x / 16 + y / 8) % 2 ? '#d29a4c' : '#8c5c25'; g.fillRect(x, y, 16, 8);
    }
  }, [2, 1]),
  awning: canvasTex(128, 64, (g, w, h) => {
    for (let x = 0; x < w; x += 16) { g.fillStyle = (x / 16) % 2 ? '#f3ead2' : '#c8322c'; g.fillRect(x, 0, 16, h); }
    g.fillStyle = '#1d4f9a'; for (let x = 0; x < w; x += 16) { g.beginPath(); g.moveTo(x, h - 10); g.lineTo(x + 8, h); g.lineTo(x + 16, h - 10); g.fill(); }
  }),
  bread: canvasTex(128, 128, (g, w, h) => { // yağ çörəyi: golden, scored, buttery
    const gr = g.createRadialGradient(64, 60, 10, 64, 64, 64); gr.addColorStop(0, '#ffd77a'); gr.addColorStop(0.7, '#e59a2f'); gr.addColorStop(1, '#a8601b');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#8d4d12'; g.lineWidth = 5; g.beginPath(); g.arc(64, 64, 34, 0, Math.PI * 2); g.stroke();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g.beginPath(); g.moveTo(64 + Math.cos(a) * 12, 64 + Math.sin(a) * 12); g.lineTo(64 + Math.cos(a) * 30, 64 + Math.sin(a) * 30); g.stroke(); }
    g.fillStyle = '#4a2a0c'; for (let i = 0; i < 14; i++) { const a = i * 2.4, r = 44 + (i % 3) * 5; g.beginPath(); g.arc(64 + Math.cos(a) * r, 64 + Math.sin(a) * r, 2, 0, 7); g.fill(); }
  }),
  tower: canvasTex(128, 256, (g, w, h) => { // Qız Qalası masonry bands
    g.fillStyle = '#c9a06a'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 12) { g.fillStyle = (y / 12) % 2 ? '#bb9058' : '#d4ad75'; g.fillRect(0, y, w, 12); }
    g.fillStyle = '#3a2a1e'; for (let i = 0; i < 6; i++) g.fillRect(20 + (i % 3) * 36, 40 + i * 34, 6, 14);
  }, [3, 1]),
  sky: canvasTex(16, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#3d8fd6'); gr.addColorStop(0.55, '#9fd0f0'); gr.addColorStop(0.8, '#f6dfae'); gr.addColorStop(1, '#f3d6a4');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }),
};
function rrectPath(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
scene3.background = TEX.sky;

// -- Shared materials --------------------------------------------------------------------------
const M = {};
function mat(name, color, opts = {}) { return M[name] || (M[name] = new THREE.MeshLambertMaterial({ color, ...opts })); }
function texMat(name, map, opts = {}) { return M[name] || (M[name] = new THREE.MeshLambertMaterial({ map, ...opts })); }
const G = { // shared geometries
  box: new THREE.BoxGeometry(1, 1, 1),
  sphere: new THREE.SphereGeometry(1, 16, 12),
  sphereLo: new THREE.SphereGeometry(1, 9, 7),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 16),
  cylLo: new THREE.CylinderGeometry(1, 1, 1, 8),
  cone: new THREE.ConeGeometry(1, 1, 10),
  plane: new THREE.PlaneGeometry(1, 1),
  torus: new THREE.TorusGeometry(1, 0.22, 8, 18),
  shadow: new THREE.CircleGeometry(1, 20),
};
function part(geo, material, sx, sy, sz, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, material); m.scale.set(sx, sy, sz); m.position.set(x, y, z);
  if (parent) parent.add(m); return m;
}
const shadowMat = new THREE.MeshBasicMaterial({ color: '#3a2410', transparent: true, opacity: 0.32, depthWrite: false });

function makeHouse(side, rnd) {
  const g = new THREE.Group(), h = 5 + rnd() * 5, w = 5 + rnd() * 3, d = 5;
  const wallM = texMat('wallM', TEX.wall);

  const face = -side * 0.02; // the street-facing wall's x, inset
  const floors = Math.max(1, Math.floor(h / 3));
  for (let f = 0; f < floors; f++) {
    const y = 1.6 + f * 3;

      win.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;

      const bx = -side * 0.7;
      part(G.box, mat('balcony', '#7a4a22'), 1.4, 0.15, w * 0.8, bx, y - 0.9, 0, g);
      part(G.box, mat('balconyRail', '#5e3618'), 0.1, 0.7, w * 0.8, bx * 2, y - 0.5, 0, g);

        const c = part(G.plane, texMat('crp' + tex.uuid, tex, { side: THREE.DoubleSide }), 1.6, 2.2, 1, bx * 2 - side * 0.06, y - 1.4, 0, g);
        c.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;

    }
  }
  if (rnd() < 0.5) { // ground floor: a shop door with an arch
    const door = part(G.plane, mat('door', '#4a2a14'), 1.4, 2.2, 1, face - side * 0.01, 1.1, (rnd() - 0.5) * (w - 2), g);

  return { g, w };
}

// The run's state. Distance runs along -z: an object at track position s sits at z = -s.
const KIND = { // what each obstacle asks for, and what a head-on hit does
  basket: { len: 1.1, top: 0.85, bottom: 0, frontal: 'stumble', half: 0.95 }, // jump it
  carpet: { len: 0.3, top: 2.62, bottom: 1.15, frontal: 'stumble', half: 1.0 }, // slide under it
  stall: { len: 1.5, top: 3.0, bottom: 0, frontal: 'crash', half: 0.95 },      // swerve round it
  phaeton: { len: 5.6, top: 2.4, bottom: 0, frontal: 'crash', half: 0.85 },     // swerve round it
  cart: { len: 6, top: 1.6, bottom: 0, frontal: 'crash', half: 0.9, roof: true }, // ramp up and run along the roof
  caravan: { len: 7.2, top: 2.3, bottom: 0, frontal: 'crash', half: 0.8, moves: true }, // oncoming: swerve
  ramp: { len: 4, top: 1.6, bottom: 0, frontal: null, half: 0.8, ramp: true },
};
let obstacles = [], pickups = [], scenery = [], gates = [];
let gen; // the street generator's state
const PSTAND = 1.15, PSLIDE = 0.5, PHALF = 0.3, PDEPTH = 0.3;
const laneX = lane => (lane - 1) * tune.lane_width;

function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  for (const o of obstacles) worldRoot.remove(o.mesh);
  for (const p of pickups) worldRoot.remove(p.mesh);
  for (const s of scenery) worldRoot.remove(s);
  for (const s of gates) worldRoot.remove(s);
  obstacles = []; pickups = []; scenery = []; gates = [];
  // state.gained: what this run gained or learned, the high the ending shows.
  state = {
    t: 0, s: 0, prevS: 0, speed: tune.speed_start, score: 0, bread: 0, narGot: 0, gained: '',
    lane: 1, prevLane: 1, x: 0, prevX: 0, y: 0, prevY: 0, vy: 0, grounded: true, groundY: 0,
    slide: 0, airT: 0, jumpBuf: 0, onRoof: false,
    divT: 0, divGap: tune.div_near_gap, introT: tune.div_intro_time, stumbleT: 0,
    power: { magnet: 0, shoe: 0, double: 0, pole: 0, simurq: 0 }, carpet: 0, carpets: tune.carpets_per_run,
    mult: 1, dead: null, deadT: 0, continues: 0, invuln: 0, stepT: 0, flash: 0, best: save.get('best'),
    banner: '', bannerT: 0, newBest: false,

  gen = { s: 0, rows: 0, reserved: [0, 0, 0], sceneryS: { '-1': -20, '1': -20 }, nextGate: 300 };
  // the opening: the Div bursts out of his cave behind you, and a row of bread leads the way
  breadLine(1, 14, tune.bread_line + 2, 0);
  gen.s = tune.speed_start * tune.safe_start;

}

// -- The street generator: hand-made rows, each one passable at the speed it is met -------------
function difficulty(t) { return Math.min(1, t / tune.ramp_time); }
function speedAt(t) { return Math.min(tune.speed_max, tune.speed_start + tune.speed_ramp * t); }
function addObstacle(kind, lane, s0, opts = {}) {
  const k = KIND[kind];
  let mesh;
  if (kind === 'basket') mesh = makeBaskets();
  else if (kind === 'carpet') mesh = makeCarpetRope([TEX.carpetRed, TEX.carpetBlue, TEX.carpetGreen][rng() * 3 | 0]);
  else if (kind === 'stall') mesh = makeStall();
  else if (kind === 'phaeton') mesh = makePhaeton();
  else if (kind === 'cart') mesh = makeCart(opts.len || k.len);
  else if (kind === 'ramp') mesh = makeRamp();
  else if (kind === 'caravan') { mesh = new THREE.Group(); mesh.userData.camels = []; for (let i = 0; i < 3; i++) { const c = makeCamel(); c.position.z = -i * 2.4 + 2.4; mesh.add(c); mesh.userData.camels.push(c); } }
  const len = opts.len || k.len;
  const o = { kind, lane, s0, s1: s0 + len, len, top: k.top, bottom: k.bottom, mesh, hit: false };
  o.prevS0 = s0;
  mesh.position.set(laneX(lane), 0, -(s0 + len / 2));
  worldRoot.add(mesh); obstacles.push(o);
  return o;
}
function addPickup(kind, lane, s, y) {
  const mesh = kind === 'bread' ? makeBread() : kind === 'nar' ? makeNar() : kind === 'magnet' ? makeSini() : kind === 'shoe' ? makeChariq() : kind === 'simurq' ? makeFeather() : kind === 'pole' ? makePole() : makeTendir();
  const p = { kind, lane, x: laneX(lane), s, y, mesh, taken: false, spin: rng() * 6 };
  mesh.position.set(p.x, y, -s); worldRoot.add(mesh); pickups.push(p);
}
function breadLine(lane, s, n, y, gap = 2.2) { for (let i = 0; i < n; i++) addPickup('bread', lane, s + i * gap, y + 0.6); }
function skyBread() { // a winding line of bread high over the street, for the Simurq's flight
  const n = Math.floor(tune.simurq_time * state.speed / 3.2);
  for (let i = 0; i < n; i++) {
    const lane = Math.round(1 + Math.sin(i * 0.35) * 1.2);
    addPickup('bread', Math.max(0, Math.min(2, lane)), state.s + 14 + i * 3, tune.simurq_height + 0.6);
  }
}
function breadArc(lane, sMid, n, h) { // an arc over a low obstacle: the jump's path
  for (let i = 0; i < n; i++) { const u = i / (n - 1) * 2 - 1; addPickup('bread', lane, sMid + u * 3.2, 0.6 + h * (1 - u * u)); }
}
const INTRO = [ // the first rows teach one move each
  [['basket', 1]], [['carpet', 0]], [['stall', 2]], [['basket', 0], ['carpet', 2]],
  [['cart', 1, { ramp: true }]], [['phaeton', 2]],
];
function genRow() {
  const s = gen.s, t = s / Math.max(1, (tune.speed_start + speedAt(s / tune.speed_start)) / 2); // about when the player gets here
  const d = difficulty(t), v = speedAt(t);
  let row;
  if (gen.rows < INTRO.length) row = INTRO[gen.rows];
  else {
    row = [];
    const free = [0, 1, 2].filter(l => gen.reserved[l] <= s);
    if (!gen.caravans && t > tune.caravan_after && free.length) { // the first caravan comes on time, alone
      row.push(['caravan', free[rng() * free.length | 0]]);
    } else {
    let n = 1;
    const r = rng();
    if (t > tune.double_block_after && r < 0.25 + 0.4 * d) n = 2;
    if (t > tune.double_block_after + 30 && r < 0.12 + 0.2 * d) n = 3;
    n = Math.min(n, free.length);
    const lanes = free.sort(() => rng() - 0.5).slice(0, n); // seeded shuffle
    let safe = n < 3; // three lanes blocked: at least one must be jumped or slid
    lanes.forEach((lane, i) => {
      const pool = ['basket', 'carpet', 'stall', 'stall', 'phaeton', 'cart', 'cart'];
      if (t > tune.caravan_after && n < 3 && !row.some(e => e[0] === 'caravan')) pool.push('caravan', 'caravan');
      let kind = pool[rng() * pool.length | 0];
      if (n === 3 && i === 2 && !safe) kind = rng() < 0.5 ? 'basket' : 'carpet';
      if (n === 3 && kind === 'caravan') kind = 'stall';
      if (kind === 'basket' || kind === 'carpet' || (kind === 'cart')) safe = true;
      const e = [kind, lane, {}];
      if (kind === 'cart') { e[2].ramp = n === 3 || rng() < 0.6; if (d > 0.4 && rng() < 0.4) e[2].len = 12; }
      row.push(e);
    });
    }
  }
  let end = s;
  const used = new Set();
  for (const [kind, lane, opts = {}] of row) {
    used.add(lane);
    if (kind === 'caravan') { // place it so it meets the runner at s: it walks toward you
      const ahead = Math.max(0, s - state.s), at = s + tune.caravan_speed * ahead / Math.max(1, state.speed);
      const o = addObstacle('caravan', lane, at); o.moving = true; gen.caravans = (gen.caravans || 0) + 1;
      gen.reserved[lane] = at + o.len + 4; // nothing else in its lane on the stretch it walks
      end = Math.max(end, s + 3);
      continue;
    }
    if (kind === 'cart') {
      let s0 = s;
      if (opts.ramp) { addObstacle('ramp', lane, s); s0 = s + KIND.ramp.len; }
      const o = addObstacle('cart', lane, s0, { len: opts.len });
      breadLine(lane, s0 + 0.8, Math.floor(o.len / 2.2), KIND.cart.top);
      end = Math.max(end, o.s1);
      continue;
    }
    const o = addObstacle(kind, lane, s);
    if (kind === 'basket' && rng() < 0.6) breadArc(lane, s + o.len / 2, 5, 1.4);
    end = Math.max(end, o.s1);
  }
  // bread in a free lane, and now and then a nar or a power-up
  const freeL = [0, 1, 2].filter(l => !used.has(l) && gen.reserved[l] <= s);
  if (freeL.length) {
    const l = freeL[rng() * freeL.length | 0];
    if (rng() < 0.7) breadLine(l, s - 4, tune.bread_line, 0);
    const r = rng();
    if (r < tune.nar_chance) addPickup('nar', l, s + 2, 1.0);
    else if (r < tune.nar_chance + tune.power_chance && gen.rows > INTRO.length) addPickup(rng() < tune.simurq_share ? 'simurq' : ['magnet', 'shoe', 'double', 'pole'][rng() * 4 | 0], l, s + 2, 1.0);
  }
  gen.rows++;
  const gap = tune.row_gap_start + (tune.row_gap_end - tune.row_gap_start) * d;
  gen.s = Math.max(s + v * gap, end + 3 + v * 0.35);
}
function fillWorld() {
  const ahead = state.s + tune.view_ahead;
  while (gen.s < ahead) genRow();
  for (const side of [-1, 1]) { // houses along both sides of the street
    while (gen.sceneryS[side] < ahead + 20) {
      const { g, w } = makeHouse(side, rng);
      g.position.set(side * 4.3, 0, -(gen.sceneryS[side] + w / 2));
      worldRoot.add(g); scenery.push(g); g.userData.s1 = gen.sceneryS[side] + w;
      gen.sceneryS[side] += w + (rng() < 0.15 ? 2.5 : 0.05);
    }
  }
  while (gen.nextGate < ahead) { // a city gate now and then: a short dark tunnel over the street
    const g = makeGate(); g.position.set(0, 0, -gen.nextGate); g.userData.s1 = gen.nextGate + 3;
    worldRoot.add(g); gates.push(g); gen.nextGate += 380 + rng() * 200;
  }
  // forget what is behind the runner
  const behind = state.s - 25;
  obstacles = obstacles.filter(o => { if (o.s1 < behind) { worldRoot.remove(o.mesh); return false; } return true; });
  pickups = pickups.filter(p => { if (p.s < behind || p.taken && p.mesh.scale.x < 0.05) { worldRoot.remove(p.mesh); return false; } return true; });
  scenery = scenery.filter(g => { if (g.userData.s1 < behind) { worldRoot.remove(g); return false; } return true; });
  gates = gates.filter(g => { if (g.userData.s1 < behind) { worldRoot.remove(g); return false; } return true; });
}

// -- The run ------------------------------------------------------------------------------------
function banner(s) { state.banner = s; state.bannerT = 1.6; }
function stumble(o) { // a small hit: the Div comes close; a second while he is close and he has you
  if (o) o.hit = true;
  if (state.invuln > 0) return;
  if (state.carpet > 0) { state.carpet = 0; sfx.shieldPop(); banner('Uçan xalça səni qorudu!'); state.invuln = 1; if (o) o.mesh.visible = false; return; }
  if (state.divT > 0 && state.stumbleT <= 0) { caught(); return; }
  if (state.stumbleT > 0) return;
  state.divT = tune.div_near_time; state.stumbleT = 0.6; state.flash = 1;
  sfx.stumble(); sfx.div(); banner('Ay Cırtdaaan!');
  events.push({ type: 'stumble', t: state.t });
}
function crash(o) {
  if (state.invuln > 0) { if (o) o.hit = true; return; }
  if (state.carpet > 0) { state.carpet = 0; sfx.shieldPop(); banner('Uçan xalça səni qorudu!'); state.invuln = 1; if (o) { o.hit = true; o.mesh.visible = false; } return; }
  if (o) o.hit = true;
  state.dead = 'crash'; state.deadT = 0; sfx.crash();
  events.push({ type: 'crash', t: state.t, kind: o ? o.kind : '' });
  endRun();
}
function caught() {
  state.dead = 'caught'; state.deadT = 0; sfx.hamm();
  events.push({ type: 'caught', t: state.t });
  endRun();
}
function endRun() {
  save.set('bread', save.get('bread') + state.bread);
  if (state.score > save.get('best')) { save.set('best', Math.floor(state.score)); state.newBest = true; }
  state.gained = state.dead === 'caught' ? 'Div səni tutdu!' : 'Bam! Div səni tutdu!';
}
function continueRun() { // spend nar: the Div backs off, the street ahead is cleared a little
  const cost = tune.continue_cost * (1 << state.continues);
  save.set('nar', save.get('nar') - cost); state.continues++;

  for (const o of obstacles) if (o.s0 < state.s + 25 && o.s1 > state.s - 2) { o.hit = true; o.mesh.visible = false; }

function supportAt(x, y, s) { // the ground under Cırtdan: the street, a ramp or a cart roof
  let g = 0, roof = false;
  for (const o of obstacles) {
    if (!(o.kind === 'ramp' || o.kind === 'cart') || o.hit && !o.mesh.visible) continue;
    if (Math.abs(x - laneX(o.lane)) > KIND[o.kind].half + PHALF * 0.5) continue;
    if (s + PDEPTH < o.s0 || s - PDEPTH > o.s1) continue;
    let h = o.top;
    if (o.kind === 'ramp') h = Math.max(0, Math.min(1, (s - o.s0) / o.len)) * o.top;
    if (y >= h - (o.kind === 'ramp' ? 0.6 : 0.35)) { if (h > g) { g = h; roof = o.kind === 'cart'; } }

}

  return Math.abs(x - laneX(o.lane)) < k.half + PHALF && s + PDEPTH > o.s0 && s - PDEPTH < o.s1 && y < o.top && y + h > o.bottom;
}

function updateRun(dt) {
  const st = state;
  st.t += dt;
  st.prevS = st.s; st.prevX = st.x; st.prevY = st.y;
  st.speed = speedAt(st.t);
  // input
  if (anyPressed(...LEFT) && st.lane > 0) { st.prevLane = st.lane; st.lane--; sfx.lane(); }
  if (anyPressed(...RIGHT) && st.lane < 2) { st.prevLane = st.lane; st.lane++; sfx.lane(); }
  if (anyPressed(...UP)) st.jumpBuf = tune.input_buffer;
  if (anyPressed(...DOWN)) {
    if (!st.grounded) st.vy = -tune.fast_fall_speed;
    st.slide = tune.slide_time; st.jumpBuf = 0; sfx.slide();
  }
  if (anyPressed(...CARPET) && st.carpets > 0 && st.carpet <= 0) { st.carpets--; st.carpet = tune.carpet_time; sfx.power(); banner('Uçan xalça!'); }
  // forward
  st.s += st.speed * dt;
  // sideways toward the lane
  const tx = laneX(st.lane), dx = tx - st.x, mv = tune.lane_change_speed * dt;
  st.x = Math.abs(dx) <= mv ? tx : st.x + Math.sign(dx) * mv;
  // vertical
  st.airT = st.grounded ? 0 : st.airT + dt;
  if (st.jumpBuf > 0 && (st.grounded || st.airT < tune.coyote_time)) {
    const h = st.power.shoe > 0 ? tune.super_jump_height : tune.jump_height;
    st.vy = Math.sqrt(2 * tune.gravity * h); st.grounded = false; st.jumpBuf = 0; st.slide = 0; st.airT = 1; sfx.jump();
  }
  st.jumpBuf = Math.max(0, st.jumpBuf - dt);
  const flying = st.power.simurq > 0;
  if (flying) { // the Simurq lifts him high and holds him there; the street passes below
    st.y += (tune.simurq_height - st.y) * Math.min(1, dt * 2.5); st.vy = 0; st.grounded = false; st.slide = 0;
    if (st.power.simurq <= dt) { st.invuln = Math.max(st.invuln, 1.6); banner('Simurq səni yerə qoydu'); } // a safe landing
  } else { st.vy -= tune.gravity * dt; st.y += st.vy * dt; }
  const sup = supportAt(st.x, st.prevY, st.s);
  if (flying) { /* in the air with the Simurq */ }
  else if (st.y <= sup.g) {
    if (!st.grounded && st.vy < -4) sfx.land();
    st.y = sup.g; st.vy = 0; st.grounded = true; st.onRoof = sup.roof;
    if (st.power.pole > 0 && st.slide <= 0) { st.vy = Math.sqrt(2 * tune.gravity * tune.pole_height); st.grounded = false; sfx.jump(); } // kəndirbaz hops
  } else st.grounded = st.y - sup.g < 0.05 && st.vy <= 0;
  st.slide = Math.max(0, st.slide - dt);
  // collisions
  const h = st.slide > 0 ? PSLIDE : PSTAND;
  for (const o of obstacles) {
    if (flying) break;
    if (o.hit || o.kind === 'ramp') continue;
    if (o.kind === 'cart' && st.y >= o.top - 0.35) continue; // on its roof
    if (!overlaps(o, st.x, st.y, h, st.s)) continue;
    if (st.power.pole > 0 && st.prevY >= o.top - 0.15) { // a kəndirbaz lands on it and springs off
      st.y = o.top; st.vy = Math.sqrt(2 * tune.gravity * tune.pole_height); sfx.jump(); continue;
    }
    const fromFront = !overlaps({ ...o, s0: o.prevS0, s1: o.prevS0 + o.len }, st.x, st.y, h, st.prevS) && Math.abs(st.prevX - laneX(o.lane)) < KIND[o.kind].half + PHALF;
    if (fromFront) { KIND[o.kind].frontal === 'crash' ? crash(o) : stumble(o); }
    else { // a side bump: back to the lane you came from

  }
  for (const o of obstacles) { // caravans walk toward you
    o.prevS0 = o.s0;
    if (o.moving) { o.s0 -= tune.caravan_speed * dt; o.s1 = o.s0 + o.len; }
  }
  // pickups
  for (const p of pickups) {
    if (p.taken) continue;
    if (p.kind === 'bread' && st.power.magnet > 0) {
      const ds = p.s - st.s, dxp = p.x - st.x;
      if (Math.abs(ds) < tune.magnet_radius && Math.abs(dxp) < tune.magnet_radius) {
        const k = Math.min(1, dt * 10); p.s -= ds * k; p.x -= dxp * k; p.y += (st.y + 0.6 - p.y) * k;
      }
    }
    if (Math.abs(p.s - st.s) < 0.8 && Math.abs(p.x - st.x) < 0.8 && Math.abs(p.y - (st.y + h / 2)) < 1.0) {
      p.taken = true;
      if (p.kind === 'bread') { st.bread++; sfx.bread(); }
      else if (p.kind === 'nar') { st.narGot++; save.set('nar', save.get('nar') + 1); sfx.nar(); banner('Nar!'); }
      else {
        st.power[p.kind] = p.kind === 'simurq' ? tune.simurq_time : tune.power_time; sfx.power();
        banner({ magnet: 'Nənənin sinisi!', shoe: 'Sehrli çarıq!', double: 'Qoşa təndir: x2!', pole: 'Kəndirbaz çubuğu!', simurq: 'Simurq quşu!' }[p.kind]);
        if (p.kind === 'simurq') skyBread();

    }
  }

  st.divT = Math.max(0, st.divT - dt); st.stumbleT = Math.max(0, st.stumbleT - dt); st.introT = Math.max(0, st.introT - dt);
  const wantGap = st.divT > 0 || st.introT > 0 ? tune.div_near_gap : tune.div_far_gap;
  st.divGap += (wantGap - st.divGap) * Math.min(1, dt * (wantGap < st.divGap ? 3 : 0.8));
  // power-ups and score
  for (const k in st.power) st.power[k] = Math.max(0, st.power[k] - dt);
  st.carpet = Math.max(0, st.carpet - dt); st.invuln = Math.max(0, st.invuln - dt);
  st.mult = Math.min(tune.mult_cap, 1 + Math.floor(st.s / tune.mult_every));

  st.bannerT = Math.max(0, st.bannerT - dt); st.flash = Math.max(0, st.flash - dt * 2);

  if (Math.floor(st.s / tune.mult_every) !== Math.floor(st.prevS / tune.mult_every)) banner(`Vurğu x${st.mult}!`);
  fillWorld();
}

function poseDiv(g, t, speed) {

function drawWorld() {

  simurq3.visible = st.power.simurq > 0 && !st.dead;

  // pickups spin and bob; taken ones shrink away

  curbs.forEach(c => (c.position.z = -s - 150)); groove.forEach(c => (c.position.z = -s - 150));

  if (st.t < 5 && !st.dead) { // the first seconds: how to move, by doing
    const k = Math.min(1, (5 - st.t) / 1.5);
    ctx.globalAlpha = k; outlined(W < 700 ? 'Sürüşdür: ← → ↑ ↓' : '← → zolaq   ↑ tullan   ↓ sürüş', W / 2, H - 130, 28, '#fff4dc'); ctx.globalAlpha = 1;
  }
}

// ---- Scenes ----------------------------------------------------------------------------------------
let scene, state;
function titleCamera(t) { // the title: Cırtdan and Nənə in the street, the Maiden Tower behind
  if (!renderer) return;
  state.prevS = state.s; nene3.visible = true;
  player3.position.set(-0.5, 0, -state.s); player3.rotation.set(0, Math.PI - 0.5, 0);
  const r = player3.userData; r.rig.rotation.x = 0; r.rig.position.y = 0;
  r.legL.rotation.x = r.legR.rotation.x = 0; r.armL.rotation.x = -0.3; r.armR.rotation.x = -2.8 + Math.sin(t * 4) * 0.3; r.armL.rotation.z = r.armR.rotation.z = 0;
  r.head.rotation.y = 0; r.torso.rotation.x = 0;
  nene3.position.set(0.9, 0, -state.s - 0.4); nene3.rotation.y = 0.4;
  div3.visible = false; fly3.visible = false;
  street.position.set(0, 0, -state.s - 150); tower.position.set(14, 0, -state.s - 120);
  const wide = W >= 900, cx = wide ? 2.2 : 0.2;
  camera.position.set(cx, 1.3, -state.s + (wide ? 4.2 : 5.6)); camera.lookAt(cx, wide ? 1.35 : 0.55, -state.s - 2);
  renderer.render(scene3, camera);
  player3.rotation.set(0, 0, 0); nene3.visible = false;
}
const FIGS = [ // ?scene=figures: every figure side by side, its name under it
  ['Cırtdan', makeCirtdan, 1.6], ['Div', makeDiv, 0.75], ['Nənə', makeNene, 1.4], ['Dəvə karvanı', makeCamel, 0.8],
  ['Fayton', makePhaeton, 0.55], ['Yük arabası', () => makeCart(4), 0.6], ['Nərdivan', makeRamp, 0.6],
  ['Səbət və küp', makeBaskets, 1.2], ['Xalça ipi', () => makeCarpetRope(TEX.carpetRed), 0.75], ['Bazar çadırı', makeStall, 0.7],
  ['Yağ çörəyi', makeBread, 2.4], ['Nar', makeNar, 2.4], ['Sini', makeSini, 2.2], ['Sehrli çarıq', makeChariq, 2.4],
  ['Qoşa təndir', makeTendir, 2.4], ['Simurq', makeSimurq, 0.85], ['Lələk', makeFeather, 1.6], ['Çubuq', makePole, 0.9], ['Uçan xalça', makeFlyCarpet, 1.1], ['Darvaza', makeGate, 0.16], ['Qız Qalası', makeTower, 0.05],
];
let figGroup = null, figLabels = [];
function buildFigures() {
  figGroup = new THREE.Group(); scene3.add(figGroup); figLabels = [];
  const cols = 7;
  FIGS.forEach(([name, make, sc], i) => {
    const m = make(); m.scale.setScalar(sc);
    const col = i % cols, row = i / cols | 0;
    const x = (col - (cols - 1) / 2) * 2.9, y = 5.6 - row * 3.1;
    m.position.set(x, y, 0); m.rotation.y = name === 'Fayton' || name === 'Yük arabası' || name === 'Dəvə karvanı' || name === 'Nərdivan' ? 0.9 : 0.35;
    if (name === 'Cırtdan' || name === 'Div' || name === 'Nənə') m.rotation.y = 0.35;
    if (['Yağ çörəyi', 'Sini'].includes(name)) m.rotation.x = 0.4;
    if (name === 'Cırtdan') m.rotation.y = Math.PI - 0.35; // his face is on -z
    if (name === 'Simurq') { m.rotation.y = 1.1; m.rotation.x = 0.3; }
    m.position.y += name === 'Yağ çörəyi' || name === 'Nar' || name === 'Sehrli çarıq' || name === 'Qoşa təndir' || name === 'Sini' ? 0.9 : 0;
    figGroup.add(m); figLabels.push([name, new THREE.Vector3(x, y - 0.35, 0)]);
  });
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      if (!figGroup) buildFigures();
      if (renderer) {
        street.visible = false; tower.visible = player3.visible = div3.visible = nene3.visible = false; worldRoot.visible = curbs[0].visible = curbs[1].visible = false;
        groove.forEach(g => (g.visible = false));
        scene3.background = new THREE.Color('#f3e2bf'); scene3.fog = null;
        camera.position.set(0, 2.6, 17); camera.lookAt(0, 2.6, 0); camera.fov = 52; camera.updateProjectionMatrix();
        sun.position.set(-4, 10, 10); sun.target.position.set(0, 0, 0);
        renderer.render(scene3, camera);
      }
      clear();
      for (const [name, p] of figLabels) {
        const v = p.clone().project(camera);
        const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H;
        outlined(name, x, y + 14, 18, '#fff4dc');
      }
    },
  },
  title: {
    update(dt) {
      state.t += dt;
      if (anyPressed('Enter', 'Space') || taps.length) { reset(); scene = 'play'; sfx.div(); }
    },
    draw() {
      titleCamera(state.t);
      clear();
      const g = ctx.createLinearGradient(0, 0, 0, H * 0.5); g.addColorStop(0, 'rgba(110,20,15,0.75)'); g.addColorStop(1, 'rgba(110,20,15,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.5);
      outlined(TITLE, W / 2, 86, 96, '#ffd77a');
      outlined(SUBTITLE, W / 2, 156, 38, '#fff4dc');
      outlined('«Mən balacayam, amma ağlım böyükdür!»', W / 2, 206, 24, '#ffe6b0');
      const wide = W >= 900, bw = wide ? Math.min(560, W * 0.46) : Math.min(W - 30, 560);
      const bx = wide ? W - bw - 40 : (W - bw) / 2, by = wide ? 250 : H - 330, fs = bw < 470 ? 19 : 22;
      ctx.fillStyle = 'rgba(60,20,12,0.62)'; rrect(bx, by, bw, 210, 18); ctx.fill();
      CONTROLS.forEach((c, i) => text(c, bx + bw / 2, by + 30 + i * 38, fs, '#fff4dc'));
      const pulse = 0.75 + 0.25 * Math.sin(state.t * 4);
      ctx.globalAlpha = pulse; outlined('Toxun və ya Enter: Qaç!', W / 2, H - 70, 40, '#ffd77a'); ctx.globalAlpha = 1;
      text(`Rekord: ${save.get('best')}`, 24, H - 24, 22, '#fff4dc', 'left');
      hudIconNar(W - 120, H - 28, 12); text(String(save.get('nar')), W - 96, H - 26, 22, '#fff4dc', 'left');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape') || tapIn(...BTN.pause())) { scene = 'pause'; return; }
      if (tapIn(...BTN.mute())) setMuted(!muted);
      if (state.dead) {
        state.deadT += dt; state.t += dt;
        if (state.deadT > 1.3) scene = 'over';
        return;
      }
      updateRun(dt);
    },
    draw() { drawWorld(); clear(); drawHud(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || taps.length) scene = 'play'; },
    draw() {
      scenes.play.draw();
      ctx.fillStyle = 'rgba(40,12,8,0.55)'; ctx.fillRect(0, 0, W, H);
      outlined('Fasilə', W / 2, H / 2 - 20, 64, '#ffd77a'); outlined('Toxun və ya P: davam', W / 2, H / 2 + 50, 30, '#fff4dc');
    },
  },
  over: {
    update() {
      const cost = tune.continue_cost * (1 << state.continues), canCont = save.get('nar') >= cost;
      const b = overButtons();
      if (canCont && (pressed('KeyC') || tapIn(...b.cont))) { continueRun(); scene = 'play'; return; }
      if (pressed('KeyR') || pressed('Enter') || tapIn(...b.again)) { reset(); scene = 'play'; sfx.div(); }
    },
    draw() {
      scenes.play.draw();
      const st = state, cost = tune.continue_cost * (1 << st.continues), canCont = save.get('nar') >= cost, b = overButtons();
      ctx.fillStyle = 'rgba(40,12,8,0.5)'; ctx.fillRect(0, 0, W, H);
      outlined(st.gained || 'Div səni tutdu!', W / 2, 110, 64, '#ffd77a');
      outlined(st.dead === 'caught' ? 'Hamm! Div Cırtdanı torbaya qoydu.' : 'Cırtdan toqquşdu, Div çatdı!', W / 2, 170, 28, '#fff4dc');
      const pw = Math.min(W - 40, 520), px = (W - pw) / 2;
      ctx.fillStyle = 'rgba(60,20,12,0.7)'; rrect(px, 210, pw, 170, 18); ctx.fill();
      text(`Xal: ${Math.floor(st.score)}`, W / 2, 245, 34, '#fff4dc');
      hudIconBread(W / 2 - 90, 295, 16); text(`${st.bread} yağ çörəyi`, W / 2 + 20, 295, 26, '#ffd77a');
      text(st.newBest ? 'Yeni rekord!' : `Rekord: ${save.get('best')}`, W / 2, 345, 26, st.newBest ? '#ffcf4a' : '#fff4dc');
      ctx.globalAlpha = canCont ? 1 : 0.45;
      ctx.fillStyle = '#8e1d22'; rrect(...b.cont, 18); ctx.fill();
      hudIconNar(b.cont[0] + 40, b.cont[1] + b.cont[3] / 2, 16);
      text(`Nar ilə davam et (${cost})  C`, b.cont[0] + b.cont[2] / 2 + 18, b.cont[1] + b.cont[3] / 2, 26, '#fff4dc');
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#2b7a48'; rrect(...b.again, 18); ctx.fill();
      text('Yenidən qaç  Enter', b.again[0] + b.again[2] / 2, b.again[1] + b.again[3] / 2, 28, '#fff4dc');
      if (!canCont) text('Nar yoxdur: yolda nar tap', W / 2, b.cont[1] - 18, 20, '#ffe6b0');
    },
  },
  results: { // the game is endless: no results screen, kept for the starter's shape
    update() { scene = 'over'; },
    draw() { scenes.over.draw(); },
  },
};
function overButtons() {
  const bw = Math.min(W - 40, 440), bx = (W - bw) / 2;
  return { cont: [bx, 420, bw, 72], again: [bx, 510, bw, 72] };
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); taps = [];
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
