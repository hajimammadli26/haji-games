// ---- Input: keys by position (event.code), OS key repeat ignored; swipes and taps ---------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
const anyPressed = (...codes) => codes.some(c => hit.has(c));
addEventListener('keydown', e => {

addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
// Touch: a swipe is a lane change, jump or slide; a tap is a tap (HUD buttons, screens);
// two taps close together are the flying carpet.
let touch = null, lastTap = -1, taps = []; // taps: HUD-space points of this step's taps
function hudPoint(e) { return { x: e.clientX / HUD_SCALE, y: e.clientY / HUD_SCALE }; }

  if (Math.abs(dx) < m && Math.abs(dy) < m) return;

function tone(freq, dur, type = 'square', vol = 0.3, slideTo = 0, delay = 0) {

const sfx = {

  nar() { tone(660, 0.1, 'triangle', 0.25); tone(990, 0.1, 'triangle', 0.25, 0, 0.08); tone(1320, 0.2, 'triangle', 0.25, 0, 0.16); },
  jump() { tone(300, 0.18, 'triangle', 0.22, 620); },
  slide() { noise(0.25, 0.25, 500); },
  land() { noise(0.06, 0.2, 200); },
  step() { noise(0.03, 0.06, 1400); },
  lane() { noise(0.07, 0.12, 2400); },
  stumble() { tone(140, 0.25, 'square', 0.25, 70); noise(0.15, 0.3, 300); },
  crash() { noise(0.5, 0.5, 180); tone(110, 0.5, 'sawtooth', 0.3, 40); },
  div() { tone(90, 0.3, 'sawtooth', 0.22, 60); say.ayCirtdan(); }, // "Ay Cırtdaaan!"
  hamm() { tone(160, 0.12, 'sawtooth', 0.2, 90); say.hamm(); },
  power() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'triangle', 0.2, 0, i * 0.06)); },

// ---- Music: a 6/8 dance in the Şur mode, tar and balaban over nağara and a modern kick ------------------
// Everything is synthesised here: no recordings. 'menu' is calm, 'run' follows the speed, 'fly' is epic.
const SHUR = [0, 1, 3, 5, 7, 8, 10, 12, 13, 15]; // semitones above D: D Eb F G A Bb C D Eb F
const TUNE = [ // scale degrees, one per eighth note, 6 a bar; -1 rests
  [4, 3, 4, 5, 4, 3], [2, 1, 2, 3, 2, -1], [4, 5, 7, 5, 4, 3], [2, 3, 1, 0, 0, -1],
  [7, 6, 7, 5, 6, 4], [5, 4, 3, 4, 2, -1], [3, 4, 5, 4, 3, 1], [2, 1, 0, -1, 0, -1],
];
const music = { mode: null, gain: null, next: 0, step: 0 };
const noteHz = (deg, oct = 0) => 293.66 * Math.pow(2, (SHUR[deg] + oct * 12) / 12);
function setMusic(mode) { if (music.mode !== mode) { music.mode = mode; music.step = 0; if (audio) music.next = audio.ac.currentTime + 0.05; } }
function musicNode() {

  music.gain.gain.value = tune.music_volume; return music.gain;
}
function tar(t, hz, dur, vol) { // plucked, bright, quick decay, a little tremolo on long notes
  const ac = audio.ac, o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = hz; o2.frequency.value = hz * 2.005;
  f.type = 'lowpass'; f.frequency.setValueAtTime(hz * 8, t); f.frequency.exponentialRampToValueAtTime(hz * 1.5, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const g2 = ac.createGain(); g2.gain.value = 0.25;
  o.connect(f); o2.connect(g2).connect(f); f.connect(g).connect(musicNode());
  o.start(t); o2.start(t); o.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);

function balaban(t, hz, dur, vol) { // a soft reed: slow attack, vibrato
  const ac = audio.ac, o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = hz; lfo.frequency.value = 5.5; lg.gain.value = hz * 0.012;
  lfo.connect(lg).connect(o.frequency);
  f.type = 'bandpass'; f.frequency.value = hz * 2; f.Q.value = 0.7;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(0.08, dur * 0.3)); g.gain.setValueAtTime(vol, t + dur * 0.75); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(f).connect(g).connect(musicNode()); o.connect(g);
  o.start(t); lfo.start(t); o.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
}
function drum(t, kind, vol) { // nağara: dum (low, centre) and tek (high, rim); kick: the modern beat
  const ac = audio.ac, g = ac.createGain();
  if (kind === 'kick' || kind === 'dum') {
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(kind === 'kick' ? 120 : 160, t); o.frequency.exponentialRampToValueAtTime(kind === 'kick' ? 42 : 70, t + 0.18);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g).connect(musicNode()); o.start(t); o.stop(t + 0.3);
  } else {
    const n = Math.floor(ac.sampleRate * 0.06), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    let x = 777; for (let i = 0; i < n; i++) { x = (x * 1103515245 + 12345) & 0x7fffffff; d[i] = (x / 0x7fffffff * 2 - 1) * (1 - i / n); }
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(); src.buffer = b; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 1.2;
    g.gain.value = vol; src.connect(f).connect(g).connect(musicNode()); src.start(t);

function scheduleMusic() {
  if (!audio || muted || !music.mode || tune.music_volume <= 0) { if (audio) music.next = audio.ac.currentTime + 0.05; return; }
  const ac = audio.ac;
  if (music.next < ac.currentTime) music.next = ac.currentTime + 0.05;
  const speed = state && scene === 'play' ? state.speed : tune.speed_start;
  const bpm = music.mode === 'menu' ? 96 : tune.music_bpm + (speed - tune.speed_start) * tune.music_bpm_gain;
  const dt = 60 / bpm;
  while (music.next < ac.currentTime + 0.2) {
    const t = music.next, i = music.step, bar = Math.floor(i / 6) % TUNE.length, beat = i % 6, deg = TUNE[bar][beat];
    if (music.mode === 'menu') {
      if (deg >= 0 && beat % 2 === 0) balaban(t, noteHz(deg), dt * 1.9, 0.16);
      if (beat === 0) tar(t, noteHz(0, -2), dt * 3, 0.12);
      if (beat === 0 || beat === 3) drum(t, 'dum', 0.18); else if (beat === 5) drum(t, 'tek', 0.05);

      if (fly && deg >= 0 && beat % 3 === 0) balaban(t, noteHz(deg), dt * 2.8, 0.14);

// ---- Voices: short Azerbaijani words, sung by a little formant synth (no recordings) ------------------
const VOWEL = { a: [800, 1250], ı: [380, 1400], i: [300, 2300], ə: [650, 1750], e: [480, 1900], o: [480, 850], m: [250, 0], n: [280, 0] };
function voice(parts, base, vol = 0.4) { // parts: [sound, seconds, pitch start, pitch end]; a sound in VOWEL or a consonant noise
  if (!audio || muted) return;

  for (const [snd, dur, p0 = 1, p1 = p0] of parts) {
    if (VOWEL[snd]) {

      o.frequency.setValueAtTime(base * p0, t); o.frequency.linearRampToValueAtTime(base * p1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.setValueAtTime(vol, t + dur - 0.03); g.gain.linearRampToValueAtTime(0.0001, t + dur);

      f.type = snd === 'h' ? 'highpass' : 'bandpass'; f.frequency.value = { c: 3000, t: 4500, d: 900, h: 1500, r: 1200 }[snd] || 2000;
      g.gain.value = vol * (snd === 'h' ? 0.5 : 0.8); src.connect(f).connect(g).connect(audio.out); src.start(t);
    }
    t += dur;
  }
}

// -- Painted textures, drawn once in code --------------------------------------------------------
function canvasTex(w, h, draw, repeat) {

  draw(c.getContext('2d'), w, h);

  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }

function buta(g, x, y, s, rot, fill, line) { // the paisley teardrop, the national ornament
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 10);
  g.bezierCurveTo(-9, 9, -10, -2, -4, -7); g.bezierCurveTo(1, -11, 8, -10, 7, -15);
  g.bezierCurveTo(12, -6, 10, 8, 0, 10); g.closePath();

function currentMissions() {
  const set = save.get('mset'), prog = save.get('mprog');
  return [0, 1, 2].map(i => {
    const m = MISSIONS[(set * 3 + i) % MISSIONS.length];
    const target = Math.round(m.t * (1 + set * tune.mission_scale));
    return { ...m, target, prog: Math.min(target, prog[i] || 0) };
  });
}
function mission(kind, v) {
  const ms = currentMissions(), prog = save.get('mprog').slice();
  let changed = false, done = false;
  ms.forEach((m, i) => {
    if (m.k !== kind || prog[i] >= m.target) return;
    const nv = Math.min(m.target, m.run ? Math.max(prog[i], v) : prog[i] + v);
    if (nv === prog[i]) return;
    prog[i] = nv; changed = true;
    if (nv >= m.target) { done = true; banner('Tapşırıq bitdi!'); sfx.nar(); events.push({ type: 'mission', what: m.k }); }
  });
  if (!changed) return;
  save.put('mprog', prog);
  if (done) {
    if (ms.every((m, i) => prog[i] >= m.target)) { // the set is done: +1 multiplier for good
      save.put('mmult', save.get('mmult') + 1); save.put('mset', save.get('mset') + 1); save.put('sets', save.get('sets') + 1);
      save.put('mprog', [0, 0, 0]); banner(`Üç tapşırıq bitdi! Vurğu x${save.get('mmult')}`); sfx.power();
    }
    save.flush();
  }
}

const MAX_LEVEL = 5;
function powerTime(k) { return (k === 'simurq' ? tune.simurq_time : tune.power_time) + (save.get('levels')[k] || 0) * tune.upgrade_step; }
function levelCost(k) { return tune.upgrade_cost * (1 << (save.get('levels')[k] || 0)); }
function spend(n) { if (save.get('bread') < n) { sfx.stumble(); return false; } save.set('bread', save.get('bread') - n); sfx.bread(); return true; }
function buyLevel(k) {
  const lv = save.get('levels')[k] || 0;
  if (lv >= MAX_LEVEL || !spend(levelCost(k))) return;
  save.set('levels', { ...save.get('levels'), [k]: lv + 1 }); sfx.power(); toast(`${SHOP_NAMES[k]}: ${lv + 1}-ci səviyyə`);
}
function openBox() { // Nənənin bağlaması: a random gift
  if (!spend(tune.box_cost)) return;
  const r = rng();
  if (r < 0.4) { const n = 300 + Math.floor(rng() * 13) * 100; save.set('bread', save.get('bread') + n); toast(`Bağlamadan ${n} yağ çörəyi çıxdı!`); }
  else if (r < 0.7) { save.set('nar', save.get('nar') + 1); toast('Bağlamadan nar çıxdı!'); }
  else if (r < 0.9) { save.set('carpets', save.get('carpets') + 1); toast('Bağlamadan uçan xalça çıxdı!'); }
  else { save.set('nar', save.get('nar') + 2); toast('Bağlamadan iki nar çıxdı!'); }

function overlaps(o, x, y, h, s) {

  return Math.abs(x - laneX(o.lane)) < k.half + PHALF && s + PDEPTH > o.s0 && s - PDEPTH < o.s1 && y < o.top && y + h > o.bottom;
}

function updateRun(dt) {
  const st = state;
  st.t += dt;
  st.prevS = st.s; st.prevX = st.x; st.prevY = st.y;
  st.speed = speedAt(st.t);
  // input
  if (anyPressed(...LEFT) && st.lane > 0) { st.prevLane = st.lane; st.lane--; sfx.lane(); }
  if (anyPressed(...RIGHT) && st.lane < 2) { st.prevLane = st.lane; st.lane++; sfx.lane(); }
  if (anyPressed(...UP)) st.jumpBuf = tune.input_buffer;
  if (anyPressed(...DOWN)) {
    if (!st.grounded) st.vy = -tune.fast_fall_speed;
    st.slide = tune.slide_time; st.jumpBuf = 0; sfx.slide();
  }
  if (anyPressed(...CARPET) && st.carpets > 0 && st.carpet <= 0) { st.carpets--; if (st.freeCarpets > 0) st.freeCarpets--; else save.set('carpets', save.get('carpets') - 1); st.carpet = tune.carpet_time; sfx.power(); banner('Uçan xalça!'); }
  // forward
  st.s += st.speed * dt;
  // sideways toward the lane
  const tx = laneX(st.lane), dx = tx - st.x, mv = tune.lane_change_speed * dt;
  st.x = Math.abs(dx) <= mv ? tx : st.x + Math.sign(dx) * mv;
  // vertical
  st.airT = st.grounded ? 0 : st.airT + dt;
  if (st.jumpBuf > 0 && (st.grounded || st.airT < tune.coyote_time)) {
    const h = st.power.shoe > 0 ? tune.super_jump_height : tune.jump_height;
    st.vy = Math.sqrt(2 * tune.gravity * h); st.grounded = false; st.jumpBuf = 0; st.slide = 0; st.airT = 1; sfx.jump();
  }
  st.jumpBuf = Math.max(0, st.jumpBuf - dt);
  const flying = st.power.simurq > 0;
  if (flying) { // the Simurq lifts him high and holds him there; the street passes below
    st.y += (tune.simurq_height - st.y) * Math.min(1, dt * 2.5); st.vy = 0; st.grounded = false; st.slide = 0;
    if (st.power.simurq <= dt) { st.invuln = Math.max(st.invuln, 1.6); banner('Simurq səni yerə qoydu'); } // a safe landing
  } else { st.vy -= tune.gravity * dt; st.y += st.vy * dt; }
  const sup = supportAt(st.x, st.prevY, st.s);
  if (flying) { /* in the air with the Simurq */ }
  else if (st.y <= sup.g) {
    if (!st.grounded && st.vy < -4) sfx.land();
    st.y = sup.g; st.vy = 0; st.grounded = true; st.onRoof = sup.roof;
    if (st.power.pole > 0 && st.slide <= 0) { st.vy = Math.sqrt(2 * tune.gravity * tune.pole_height); st.grounded = false; sfx.jump(); } // kəndirbaz hops
  } else st.grounded = st.y - sup.g < 0.05 && st.vy <= 0;
  st.slide = Math.max(0, st.slide - dt);
  if (st.onRoof === 'cart' && st.grounded) mission('roof', dt);
  for (const o of obstacles) { // what he got past: a basket jumped, a carpet slid under
    if (o.passed || o.s1 >= st.s - PDEPTH) continue;
    o.passed = true;
    if (o.hit || Math.abs(st.x - laneX(o.lane)) > KIND[o.kind].half) continue;
    if (o.kind === 'basket' || o.kind === 'bonfire') mission('basket', 1);
    if (o.kind === 'carpet') mission('carpet', 1);
  }
  // collisions
  const h = st.slide > 0 ? PSLIDE : PSTAND;
  for (const o of obstacles) {
    if (flying) break;
    if (o.hit || o.kind === 'ramp') continue;
    if (KIND[o.kind].roof && st.y >= o.top - 0.35) continue; // on its roof: a cart, or the camels' backs
    if (!overlaps(o, st.x, st.y, h, st.s)) continue;
    if (st.power.pole > 0 && st.prevY >= o.top - 0.15) { // a kəndirbaz lands on it and springs off
      st.y = o.top; st.vy = Math.sqrt(2 * tune.gravity * tune.pole_height); sfx.jump(); continue;
    }
    const fromFront = !overlaps({ ...o, s0: o.prevS0, s1: o.prevS0 + o.len }, st.x, st.y, h, st.prevS) && Math.abs(st.prevX - laneX(o.lane)) < KIND[o.kind].half + PHALF;
    if (fromFront) { KIND[o.kind].frontal === 'crash' ? crash(o) : stumble(o); }
    else { // a side bump: back to the lane you came from
      st.lane = st.prevLane; st.x = st.prevX; stumble(o);
    }
    if (st.dead) return;
  }
  for (const o of obstacles) { // caravans walk toward you
    o.prevS0 = o.s0;
    if (o.moving) { o.s0 -= tune.caravan_speed * dt; o.s1 = o.s0 + o.len; }
  }
  // pickups
  for (const p of pickups) {
    if (p.taken) continue;
    if (p.kind === 'bread' && st.power.magnet > 0) {
      const ds = p.s - st.s, dxp = p.x - st.x;
      if (Math.abs(ds) < tune.magnet_radius && Math.abs(dxp) < tune.magnet_radius) {
        const k = Math.min(1, dt * 10); p.s -= ds * k; p.x -= dxp * k; p.y += (st.y + 0.6 - p.y) * k;
      }
    }
    if (Math.abs(p.s - st.s) < 0.8 && Math.abs(p.x - st.x) < 0.8 && Math.abs(p.y - (st.y + h / 2)) < 1.0) {
      p.taken = true;
      if (p.kind === 'bread') { st.bread++; sfx.bread(); mission('runBread', st.bread); mission('bread', 1); }
      else if (p.kind === 'letter') takeLetter();
      else if (p.kind === 'treat') { st.bread += tune.treat_worth; sfx.bread(); mission('runBread', st.bread); mission('bread', tune.treat_worth); }
      else if (p.kind === 'finduq') { st.bread += tune.nut_worth; sfx.bread(); mission('runBread', st.bread); mission('bread', tune.nut_worth); }
      else if (p.kind === 'halva') { st.bread += tune.halva_worth; sfx.bread(); mission('runBread', st.bread); mission('bread', tune.halva_worth); }
      else if (p.kind === 'sekerbura' || p.kind === 'paxlava') { st.tokens = (st.tokens || 0) + 1; save.put('tokens', save.get('tokens') + 1); sfx.bread(); }
      else if (p.kind === 'nar') { st.narGot++; save.set('nar', save.get('nar') + 1); sfx.nar(); banner('Nar!'); }
      else {
        st.power[p.kind] = powerTime(p.kind); sfx.power(); mission('powers', 1); if (p.kind === 'simurq') mission('simurq', 1);
        banner({ magnet: 'Nənənin sinisi!', shoe: 'Sehrli çarıq!', double: 'Qoşa təndir: x2!', pole: 'Kəndirbaz çubuğu!', simurq: 'Simurq quşu!' }[p.kind]);
        if (p.kind === 'simurq') skyBread();
      }
    }
  }
  // the Div
  if (st.divT > 0 && st.divT <= dt) mission('escape', 1); // the Div came close and you got away
  st.divT = Math.max(0, st.divT - dt); st.stumbleT = Math.max(0, st.stumbleT - dt); st.introT = Math.max(0, st.introT - dt);
  const wantGap = st.divT > 0 || st.introT > 0 ? tune.div_near_gap : tune.div_far_gap;
  st.divGap += (wantGap - st.divGap) * Math.min(1, dt * (wantGap < st.divGap ? 3 : 0.8));
  // power-ups and score
  for (const k in st.power) st.power[k] = Math.max(0, st.power[k] - dt);
  st.carpet = Math.max(0, st.carpet - dt); st.invuln = Math.max(0, st.invuln - dt);
  st.mult = Math.min(tune.mult_cap, save.get('mmult') + Math.floor(st.s / tune.mult_every));
  mission('runDist', st.s);
  st.score += st.speed * dt * st.mult * (st.power.double > 0 ? 2 : 1);
  st.bannerT = Math.max(0, st.bannerT - dt); st.flash = Math.max(0, st.flash - dt * 2);
  st.stepT += dt * st.speed / 3.2;
  if (st.grounded && st.slide <= 0 && st.stepT > 1) { st.stepT = 0; sfx.step(); }
  if (Math.floor(st.s / tune.mult_every) !== Math.floor(st.prevS / tune.mult_every)) banner(`Vurğu x${st.mult}!`);
  fillWorld();
}

let animT = 0;
function poseRunner(g, u, t) { // run cycle, jump tuck, slide

  const run = Math.sin(t * Math.min(18, 6 + st.speed * 0.5));
  r.rig.rotation.x = 0; r.rig.position.y = 0;

  } else if (!st.grounded) { // jump: knees up, arms out
    r.legL.rotation.x = -0.9; r.legR.rotation.x = -0.3; r.armL.rotation.x = -2.6; r.armR.rotation.x = -2.4;
    r.armL.rotation.z = 0.4; r.armR.rotation.z = -0.4;
  } else {

    r.armL.rotation.x = -run * 0.9; r.armR.rotation.x = run * 0.9; r.armL.rotation.z = r.armR.rotation.z = 0;
    r.rig.position.y = Math.abs(run) * 0.06;

  r.head.rotation.y = state.divT > 0 ? Math.PI * 0.55 + Math.sin(t * 3) * 0.25 : 0; // glances back at the Div, face showing
}
function poseDiv(g, t, speed) {
  const r = g.userData, run = Math.sin(t * (4 + speed * 0.3));
  r.legL.rotation.x = run * 0.7; r.legR.rotation.x = -run * 0.7;
  r.armL.rotation.x = -run * 0.8 - 0.3; r.armR.rotation.x = run * 0.5 - 1.2;
  r.rig.position.y = Math.abs(run) * 0.12; r.body.rotation.z = run * 0.06;

function drawWorld() {
  if (!renderer) return;
  const st = state, a = ALPHA;
  animT = st.t;
  const s = st.prevS + (st.s - st.prevS) * a, x = st.prevX + (st.x - st.prevX) * a, y = st.prevY + (st.y - st.prevY) * a;
  player3.position.set(x, y, -s);
  player3.visible = true;
  poseRunner(player3, a, animT);
  fly3.visible = st.carpet > 0;
  pole3.visible = st.power.pole > 0; if (pole3.visible) pole3.rotation.z = Math.sin(animT * 4) * 0.2;
  simurq3.visible = st.power.simurq > 0 && !st.dead;
  if (simurq3.visible) { // Cırtdan hangs from its talons
    simurq3.position.set(x, y + 1.9, -s); const fl = Math.sin(animT * 9) * 0.5;
    simurq3.userData.wings.forEach((w, i) => (w.rotation.z = i ? -fl : fl));
  }
  if (st.carpet > 0) fly3.rotation.z = Math.sin(animT * 6) * 0.05;
  if (st.invuln > 0) player3.visible = Math.floor(animT * 12) % 2 === 0;
  if (st.dead) { player3.rotation.x = st.dead === 'crash' ? Math.min(1.4, st.deadT * 4) : 0; }
  else player3.rotation.x = 0;
  // the Div behind, a little to the side so you see him and Cırtdan both
  let gap = st.divGap;
  if (st.dead) gap = Math.max(0.6, tune.div_near_gap - st.deadT * 3);
  div3.position.set(x * 0.6 + (st.dead ? 0 : -0.9), 0, -(s - gap)); div3.rotation.y = Math.PI; // runs toward -z, his back to the camera
  div3.visible = gap < tune.div_far_gap - 1;
  poseDiv(div3, animT, st.speed);
  if (st.dead && st.deadT > 0.4) { div3.userData.armR.rotation.x = -2.6; div3.userData.armL.rotation.x = -2.6; }
  // pickups spin and bob; taken ones shrink away
  for (const p of pickups) {
    p.mesh.position.set(p.x, p.y + (p.kind === 'bread' ? 0 : Math.sin(animT * 3 + p.spin) * 0.12), -p.s);
    p.mesh.rotation.y = animT * 3 + p.spin;

  if (snow && snow.visible) { snow.position.set(x, 0, -s - 20); snow.geometry.attributes.position.array.forEach((v, i, a) => { if (i % 3 === 1) { a[i] = v - 0.04; if (a[i] < 0) a[i] += 16; } }); snow.geometry.attributes.position.needsUpdate = true; }
  for (const o of obstacles) {
    if (o.mesh.userData.bubble) o.mesh.userData.bubble.scale.setScalar(0.1 + 0.14 * Math.abs(Math.sin(animT * 3 + o.s0)));
    if (o.kind === 'bonfire') o.mesh.userData.flames.forEach((f, i) => { f.scale.y = f.userData.h * (1 + 0.25 * Math.sin(animT * 14 + i * 2)); });
    if (o.moving) {
      o.mesh.position.z = -(o.s0 + o.len / 2);
      for (const c of o.mesh.userData.camels) c.userData.legs.forEach((l, i) => { l.rotation.x = Math.sin(animT * 7 + i * 1.6 + c.position.z) * 0.45; });
    }
  }
  // the street, curbs and lane grooves follow the runner; the cobbles scroll
  street.position.set(0, 0, -s - 150); street.material.map.offset.y = (s / 4) % 1;
  curbs.forEach(c => (c.position.z = -s - 150)); groove.forEach(c => (c.position.z = -s - 150));
  groove.forEach((c, i) => (c.position.x = (i ? 0.5 : -0.5) * tune.lane_width));
  tower.position.set(26, 0, -s - 230); for (const id in BACKS) BACKS[id].position.set(0, 0, -s - 190); TEX.water.offset.y = -animT * 1.5 % 1; // the Maiden Tower always on the horizon, slightly right
  // camera: fixed behind and above
  const shake = st.flash > 0 ? Math.sin(animT * 60) * 0.08 * st.flash : 0;
  const tall = camera.aspect < 1, follow = tall ? 0.85 : 0.55; // a phone held upright: higher, looking down past the Div
  camera.position.set(x * follow + shake, (tall ? 4.9 : 3.7) + y * 0.6, -s + (tall ? 5.6 : 6.2));
  camera.lookAt(x * (tall ? 0.75 : 0.3), (tall ? 0.6 : 1.0) + y * 0.55, -s - (tall ? 5 : 7));
  sun.position.set(-6 + x, 14, -s + 4); sun.target.position.set(x, 0, -s - 6);
  renderer.render(scene3, camera);
}

  drawFrame();
}
function drawFrame() { scenes[scene].draw(); try { scheduleMusic(); } catch (e) {} }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
